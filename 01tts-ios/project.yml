name: ListeningLab
options:
  bundleIdPrefix: xyz.zhchoice
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: RZNT53LJ2J
    CODE_SIGN_STYLE: Automatic
targets:
  ListeningLab:
    type: application
    platform: iOS
    sources:
      - path: ListeningLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.zhchoice.listeninglab
        PRODUCT_NAME: ListeningLab
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ListeningLab/Info.plist
    scheme:
      testTargets:
        - ListeningLabTests
  ListeningLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListeningLabTests
    dependencies:
      - target: ListeningLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.zhchoice.listeninglab.tests
        GENERATE_INFOPLIST_FILE: YES
