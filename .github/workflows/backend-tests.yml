name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r 01tts-worker/requirements.txt
      - name: Test backend without external provider calls
        working-directory: 01tts-worker
        run: python -m unittest discover -s tests -v
