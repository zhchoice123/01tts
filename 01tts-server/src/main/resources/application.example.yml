spring:
  datasource:
    url: jdbc:h2:file:./data/tts
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
    timeout: 5s

tts:
  storage-dir: ${TTS_STORAGE_DIR:./storage}
