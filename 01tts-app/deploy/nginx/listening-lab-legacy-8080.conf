# Compatibility bridge for Android clients that still use the legacy
# http://42.192.62.145:8080 fallback. The Python API itself remains bound to
# 127.0.0.1 and this listener can be removed after legacy clients upgrade.
server {
    listen 10.0.12.5:8080;
    server_name _;

    access_log /var/log/nginx/listening-lab-legacy-8080.access.log main;
    error_log /var/log/nginx/listening-lab-legacy-8080.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host zhchoice.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }
}
